openapi: 3.1.0
info:
  title: Product Catalog API
  version: 0.2.0
  description: REST API for managing the product catalog.
servers:
  - url: /
    description: Root of the API host (the web client's VITE_API_URL).
tags:
  - name: health
    description: Liveness and readiness probes.
  - name: products
    description: Product catalog management.
  - name: docs
    description: Browsable API documentation.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: Reports that the process is alive. It does not check dependencies.
      tags: [health]
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: Pings the database with a short timeout.
      tags: [health]
      security: []
      responses:
        "200":
          description: Every dependency is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /api/v1/products:
    get:
      operationId: listProducts
      summary: List products
      description: >-
        Returns one page of non-deleted products that match every given filter.
        `min_price` and `max_price` require `currency` (prices in different
        currencies are never compared), and `min_price` must not exceed
        `max_price`. Sorting by `price` groups by currency (MXN, then USD) and
        orders by price within each group. Sorting by `name` follows Spanish
        alphabetical order (case and accents ignored, ñ after n). Ties are
        broken by `id`, so pages never repeat or skip products. A page beyond
        the last one returns an empty `data` with the real `total`.
      tags: [products]
      security: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, format: int32, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 20 }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/Category" }
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: currency
          in: query
          schema: { $ref: "#/components/schemas/Currency" }
        - name: min_price
          in: query
          description: Minimum price in cents, inclusive. Requires `currency`.
          schema: { type: integer, format: int64, minimum: 0, maximum: 99999999999 }
        - name: max_price
          in: query
          description: Maximum price in cents, inclusive. Requires `currency`.
          schema: { type: integer, format: int64, minimum: 0, maximum: 99999999999 }
        - name: q
          in: query
          description: >-
            Matches products whose name or SKU contains the text, ignoring case
            and accents. Surrounding spaces are ignored; `%`, `_` and `\` match
            literally.
          schema: { type: string, maxLength: 100 }
        - name: sort
          in: query
          schema: { type: string, enum: [name, price, stock, created_at], default: created_at }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: One page of products.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createProduct
      summary: Create a product
      description: >-
        The SKU is trimmed and uppercased before validation. `currency`
        defaults to MXN and `is_active` to true. An empty or whitespace-only
        `description` means no description.
      tags: [products]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProductRequest" }
      responses:
        "201":
          description: Product created.
          headers:
            Location:
              description: Path of the new product, e.g. /api/v1/products/{id}.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: "`SKU_ALREADY_EXISTS`: another non-deleted product uses the SKU."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getProduct
      summary: Get a product
      tags: [products]
      security: []
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      operationId: updateProduct
      summary: Update a product
      description: >-
        Applies only the fields present. `version` must match the current one;
        otherwise nothing changes and the answer is 409 `VERSION_CONFLICT`.
        The SKU cannot be changed. An empty or whitespace-only `description`
        removes it. A body with only `version` is rejected with 422.
      tags: [products]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProductRequest" }
      responses:
        "200":
          description: The updated product, with `version` incremented.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteProduct
      summary: Delete a product
      description: >-
        Logical deletion: the product stops existing for every query and its
        SKU becomes available. `version` must match the current one.
      tags: [products]
      security: []
      parameters:
        - name: version
          in: query
          required: true
          description: The version the client last saw.
          schema: { type: integer, format: int32, minimum: 1 }
      responses:
        "204":
          description: Product deleted.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /docs:
    get:
      operationId: getDocs
      summary: API documentation
      description: Swagger UI for this contract.
      tags: [docs]
      security: []
      responses:
        "200":
          description: HTML page.
          content:
            text/html:
              schema: { type: string }
  /docs/openapi.yaml:
    get:
      operationId: getOpenAPI
      summary: OpenAPI contract
      description: This contract, as served by the API.
      tags: [docs]
      security: []
      responses:
        "200":
          description: The contract in YAML.
          content:
            application/yaml:
              schema: { type: string }
components:
  schemas:
    CheckStatus:
      type: string
      enum: [ok, unavailable]
    HealthResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessResponse:
      type: object
      required: [status, checks]
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/CheckStatus"
        checks:
          type: object
          required: [database]
          additionalProperties: false
          properties:
            database:
              $ref: "#/components/schemas/CheckStatus"
    Category:
      type: string
      enum: [electronics, home, food, clothing, other]
    Currency:
      type: string
      enum: [MXN, USD]
    Product:
      type: object
      additionalProperties: false
      required:
        [id, sku, name, description, price_cents, currency, stock, category, is_active, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string, pattern: "^[A-Z0-9-]{4,32}$" }
        name: { type: string, minLength: 2, maxLength: 120 }
        description:
          type: [string, "null"]
          maxLength: 2000
        price_cents: { type: integer, format: int64, minimum: 1, maximum: 99999999999 }
        currency: { $ref: "#/components/schemas/Currency" }
        stock: { type: integer, format: int32, minimum: 0 }
        category: { $ref: "#/components/schemas/Category" }
        is_active: { type: boolean }
        version: { type: integer, format: int32, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [sku, name, price_cents, stock, category]
      properties:
        sku:
          type: string
          description: Trimmed and uppercased, then must match ^[A-Z0-9-]{4,32}$.
        name:
          type: string
          description: Trimmed, then 2–120 characters.
        description:
          type: string
          description: Trimmed, then at most 2000 characters; empty means none.
        price_cents: { type: integer, format: int64, minimum: 1, maximum: 99999999999 }
        currency:
          $ref: "#/components/schemas/Currency"
          default: MXN
        stock: { type: integer, format: int32, minimum: 0 }
        category: { $ref: "#/components/schemas/Category" }
        is_active: { type: boolean, default: true }
    UpdateProductRequest:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      description: Only the fields present change. There is no `sku`.
      properties:
        version: { type: integer, format: int32, minimum: 1 }
        name:
          type: string
          description: Trimmed, then 2–120 characters.
        description:
          type: string
          description: Trimmed; empty or whitespace-only removes it.
        price_cents: { type: integer, format: int64, minimum: 1, maximum: 99999999999 }
        currency: { $ref: "#/components/schemas/Currency" }
        stock: { type: integer, format: int32, minimum: 0 }
        category: { $ref: "#/components/schemas/Category" }
        is_active: { type: boolean }
    ProductList:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        meta: { $ref: "#/components/schemas/PageMeta" }
    PageMeta:
      type: object
      additionalProperties: false
      required: [page, page_size, total, total_pages]
      properties:
        page: { type: integer, format: int32, minimum: 1 }
        page_size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
        total_pages: { type: integer, format: int32, minimum: 0 }
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - NOT_FOUND
        - SKU_ALREADY_EXISTS
        - VERSION_CONFLICT
        - PAYLOAD_TOO_LARGE
        - RATE_LIMITED
        - INTERNAL_ERROR
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: JSON field or query parameter name; empty for body-level errors.
        message: { type: string }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message:
              type: string
              description: English, for developers. A 500 carries only a generic message and the request ID.
            details:
              type: array
              items: { $ref: "#/components/schemas/ErrorDetail" }
  responses:
    BadRequest:
      description: >-
        `VALIDATION_ERROR`: malformed JSON, unknown field, wrong type, invalid
        id, missing or invalid `version`, or an invalid query parameter
        (including a price range without `currency` or min > max).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`NOT_FOUND`: the product does not exist or was deleted."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    VersionConflict:
      description: "`VERSION_CONFLICT`: the product changed since the client loaded it."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: "`PAYLOAD_TOO_LARGE`: the body exceeds 64 KiB."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      description: "`VALIDATION_ERROR`: the body breaks a business rule; `details` names each field."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: >-
        `RATE_LIMITED`: the network address exceeded a sustained 300 requests
        per minute (5 per second) or a burst of 300.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: "`INTERNAL_ERROR`: generic message with the request ID; details go only to the logs."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
